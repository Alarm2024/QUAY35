<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Not found · QUAY</title>
<meta name="theme-color" content="#0b1214"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#0b1214;--ink:#e8fbf6;--muted:#9ab3ad;--accent:#2ee6c7;--surface:#121a19;--line:rgba(46,230,199,.22);--serif:"Instrument Serif",Georgia,serif;--sans:"Inter",ui-sans-serif,system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);line-height:1.55;min-height:100vh}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px 88px}
a{color:var(--accent);text-decoration:none}
/* Links inside running text are underlined, as on elghaly.dev: by colour
   alone they were too close to the words around them (axe link-in-text-block). */
p a:not(.btn),li a:not(.btn){text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px;text-decoration-color:currentColor;text-decoration-color:color-mix(in srgb,currentColor 55%,transparent)}
p a:not(.btn):hover,li a:not(.btn):hover,p a:not(.btn):focus-visible,li a:not(.btn):focus-visible{text-decoration-color:currentColor}
header{display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:50;margin:0 -16px 12px;padding:10px 16px;background:rgba(11,18,20,.88);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none}
.qmark{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font:700 16px var(--sans);color:#04110a;background:linear-gradient(135deg,#7ee8d4,#8a7cff)}
.grad{font-weight:700;background:linear-gradient(135deg,#e8fff8 0%,#6fe0c4 42%,#9b7dff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.mark-35{font-size:24px}
.mark-quay{font-size:15px;letter-spacing:.22em}
.header-right{margin-left:auto;display:flex;align-items:center;gap:6px}
.lang-switch{display:flex;gap:3px}
.lang-btn{background:transparent;border:1px solid var(--line);color:var(--muted);padding:5px 6px;border-radius:6px;font-size:10px;cursor:pointer}
.lang-btn.on{color:var(--ink);border-color:var(--accent)}
.house{margin:16px 0;border-radius:22px;overflow:hidden;border:1px solid var(--line);background:#050508}
.house img{display:block;width:100%;height:auto}
.hero{padding:8px 0 6px}
.eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
h1{font-family:var(--serif);font-size:clamp(34px,6.6vw,54px);font-weight:400;line-height:1.08;margin-bottom:12px}
.lede,.card p,.who li{color:var(--muted);font-size:14px}
.park{font-size:14px;color:var(--muted);margin:12px 0 0}
.hero-meta{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.btn{display:inline-block;padding:11px 16px;border-radius:999px;font-size:13px;border:1px solid var(--line);color:var(--ink);background:transparent;cursor:pointer;font-family:var(--sans)}
.btn.primary{background:var(--accent);color:#04110a;border:0;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:24px}
@media(max-width:720px){.grid{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px}
.card h3{font-family:var(--serif);font-size:22px;font-weight:400;margin:0 0 8px}
.price{margin:10px 0;color:var(--accent);font-weight:600}
.grid .btn{margin-top:6px}
.recourse{font-size:14px;color:var(--muted);margin-top:18px}
.terms,.where{margin-top:18px;padding:22px;border:1px solid var(--line);border-radius:18px;background:var(--surface)}
.terms h2,.where h2{font-family:var(--serif);font-size:20px;font-weight:400;margin:0 0 10px}
.terms p,.where p{font-size:14px;color:var(--muted);margin:0 0 12px}
.where p:last-child{margin-bottom:0}
.where-list{margin:12px 0 12px 18px}
.where-list li{font-size:14px;color:var(--muted);margin:8px 0}
.who{margin:10px 0 0 18px}
.who li{margin:6px 0}
.irreversible{font-size:15px;color:var(--ink);margin:0 0 16px;line-height:1.5}
.network-warn{font-size:14px;color:var(--ink);margin:0 0 16px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:rgba(46,230,199,.06)}
.chain{padding:16px 0;border-top:1px solid var(--line)}
.chain:first-of-type{border-top:0;padding-top:0}
.chain b{display:block;font-size:11px;letter-spacing:.16em;color:var(--accent);margin-bottom:8px}
.addr-line{font-size:13px;word-break:break-all;margin-bottom:10px}
.row{display:flex;flex-wrap:wrap;gap:8px}
.k{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.pay-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
footer{margin-top:56px;padding-top:18px;border-top:1px solid var(--line);color:var(--muted);font-size:13px}
.theme-wrap{position:relative}
.theme-btn{display:flex;align-items:center;gap:6px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:6px 10px;font:600 11px var(--sans);cursor:pointer}
.theme-dot{width:10px;height:10px;border-radius:50%;background:#2ee6c7}
.theme-panel{display:none;position:absolute;right:0;top:calc(100% + 8px);min-width:200px;background:#16181d;border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:10px;z-index:80}
.theme-wrap.open .theme-panel{display:block}
.theme-panel p{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#8b93a0;margin:0 8px 8px}
.theme-item{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;color:#e8eef2;padding:10px;border-radius:12px;font:600 14px var(--sans);cursor:pointer;text-align:left}
.theme-item.on{background:#14302c;color:#2ee6c7}
.theme-item i{width:14px;height:14px;border-radius:50%;display:block}
.theme-item .ck{margin-left:auto;opacity:0}
.theme-item.on .ck{opacity:1}
.vh{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
</style>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta name="robots" content="noindex">
  <style>
    .nf{max-width:40rem;margin:12vh auto 16vh;padding:0 1rem;text-align:center}
    .nf h1{font-size:clamp(2rem,6vw,3rem);margin:0 0 .75rem}
    .nf p{margin:0 0 1.25rem;opacity:.85}
    .nf a.home{display:inline-block;padding:.7rem 1.2rem;border-radius:999px;border:1px solid currentColor;text-decoration:none;color:var(--accent,var(--g,#2ee6c7))}
  </style>
</head>
<body>
  <div class="wrap">
    <header><a class="brand" href="/">
    <span class="qmark">Q</span>
    <span class="grad mark-35">35</span>
    <span class="grad mark-quay">QUAY</span>
  </a></header>
    <main id="main" class="nf">
      <h1>Page not found</h1>
      <p>That address is not on QUAY. It may have moved, or the link had a typo.</p>
      <p><a class="home" href="/">Back to QUAY</a></p>
    </main>
  </div>
</body>
</html>
